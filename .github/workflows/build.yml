name: Build Module

on:
  push:
    branches: [ main, v2.7-fixes ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read module version
        id: mod
        run: |
          VER=$(grep '^version=' module.prop | cut -d= -f2- | tr -d '\r' | xargs)
          CODE=$(grep '^versionCode=' module.prop | cut -d= -f2- | tr -d '\r' | xargs)
          ZIP="TCP_Optimiser-${VER}-${CODE}.zip"
          echo "version=$VER"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE"    >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP"      >> "$GITHUB_OUTPUT"
          echo "Building $ZIP (version $VER, code $CODE)"

      - name: Package flashable zip
        run: |
          zip -r9 "${{ steps.mod.outputs.zip }}" . \
            -x '.git/*' -x '.github/*' -x 'README.md' -x '.gitignore' \
               -x 'update.json' -x 'changelog.md' -x 'LICENSE*' \
               -x 'banner.png' -x '*.zip'
          echo "::group::zip contents (module.prop + META-INF must be at root)"
          unzip -l "${{ steps.mod.outputs.zip }}"
          echo "::endgroup::"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.zip }}
          path: ${{ steps.mod.outputs.zip }}

      - name: Generate update.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat > update.json <<EOF
          {
            "version": "${{ steps.mod.outputs.version }}",
            "versionCode": ${{ steps.mod.outputs.code }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.mod.outputs.zip }}",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/changelog.md"
          }
          EOF
          cat update.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.mod.outputs.zip }}
            update.json
          generate_release_notes: true